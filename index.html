<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141e"><title>RIO INTENSE • Testes</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0c1019}*{box-sizing:border-box}body{margin:0}header{padding:26px 20px 20px;background:linear-gradient(140deg,#152b47,#0c1019 80%)}.brand{font-weight:900;letter-spacing:2px;font-size:26px}.brand b{color:#ff6b31}small{color:#aeb9c9}h1{font-size:29px;line-height:1.15;margin:30px 0 8px}p{color:#b9c3d0;line-height:1.5}.search{background:#1d2635;border:1px solid #344053;border-radius:15px;padding:15px;color:white;width:100%;font-size:16px}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 20px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid #334154;background:#1b2635;color:#d5deeb;padding:12px 16px;border-radius:25px}.tabs button.active{background:#ff7137;color:#111;border-color:#ff7137;font-weight:700}main{padding:0 20px 90px;max-width:850px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.card{background:#1b2432;border:1px solid #2c394b;border-radius:18px;overflow:hidden}.cover{height:135px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#254666,#24314b)}.content{padding:16px}.tag{font-size:12px;color:#ff9b70;font-weight:700}.content h3{margin:8px 0}.content p{font-size:14px;margin:4px 0 16px}.action{border:0;background:#ff7137;color:#171717;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111927;border-top:1px solid #334154;display:flex;justify-content:space-around;padding:14px}.bottom button{border:0;background:none;color:#d3dbe8;font-size:13px}.notice{font-size:12px;color:#9aa9ba;margin:15px 0}dialog{background:#1b2432;color:#fff;border:1px solid #566378;border-radius:18px;padding:25px;max-width:340px}dialog::backdrop{background:#000a}</style></head>
<body><header><div class="brand">RIO <b>INTENSE</b></div><small>Explore o melhor do Rio de Janeiro</small><h1>O Rio acontece aqui. 🌴</h1><p>Encontre lugares, eventos e experiências para curtir a cidade.</p><input class="search" id="search" placeholder="🔎 Buscar experiências..." aria-label="Buscar experiências"></header><nav class="tabs" id="tabs"></nav><main><h2 id="heading">Descubra o Rio</h2><div class="cards" id="cards"></div><p class="notice">Versão demonstrativa: locais ilustrativos, sem reservas ou eventos em tempo real.</p></main><nav class="bottom"><button onclick="setTab('Todos')">🏠 Início</button><button onclick="setTab('Eventos')">🎉 Eventos</button><button onclick="setTab('Praias')">🌊 Praias</button><button onclick="showInfo('Favoritos disponíveis em uma versão futura.')">❤️ Salvos</button></nav><dialog id="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><button class="action" onclick="document.getElementById('modal').close()">Fechar</button></dialog>
<script>
const items=[{title:'Praia de Copacabana',category:'Praias',emoji:'🏖️',area:'Zona Sul',desc:'Orla, caminhada e vista para o mar.'},{title:'Cristo Redentor',category:'Passeios',emoji:'⛰️',area:'Cosme Velho',desc:'Um dos cartões-postais mais conhecidos do Rio.'},{title:'Arcos da Lapa',category:'Noite',emoji:'🎶',area:'Centro',desc:'Um ponto clássico da vida noturna carioca.'},{title:'Feira de São Cristóvão',category:'Gastronomia',emoji:'🍲',area:'São Cristóvão',desc:'Comidas e cultura nordestina no Rio.'},{title:'Agenda de eventos',category:'Eventos',emoji:'🎉',area:'Rio de Janeiro',desc:'Espaço demonstrativo para futuros eventos cadastrados.'},{title:'Praia da Barra',category:'Praias',emoji:'🌊',area:'Barra da Tijuca',desc:'Extensa faixa de areia e esportes ao ar livre.'}];
const categories=['Todos','Eventos','Praias','Passeios','Gastronomia','Noite'];let active='Todos';const tabs=document.getElementById('tabs'),cards=document.getElementById('cards'),search=document.getElementById('search');
function setTab(v){active=v;render()}function showInfo(s,title='RIO INTENSE'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=s;document.getElementById('modal').showModal()}
function render(){tabs.innerHTML='';categories.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===active?'active':'';b.onclick=()=>setTab(c);tabs.appendChild(b)});document.getElementById('heading').textContent=active==='Todos'?'Descubra o Rio':active;cards.innerHTML='';const q=search.value.toLocaleLowerCase('pt-BR');let results=items.filter(x=>(active==='Todos'||x.category===active)&&[x.title,x.area,x.desc].join(' ').toLocaleLowerCase('pt-BR').includes(q));if(!results.length){cards.textContent='Nenhum resultado encontrado.';return}results.forEach(x=>{let article=document.createElement('article');article.className='card';let cover=document.createElement('div');cover.className='cover';cover.textContent=x.emoji;let content=document.createElement('div');content.className='content';let tag=document.createElement('div');tag.className='tag';tag.textContent=x.category+' • '+x.area;let h=document.createElement('h3');h.textContent=x.title;let p=document.createElement('p');p.textContent=x.desc;let b=document.createElement('button');b.className='action';b.textContent='Ver detalhes';b.onclick=()=>showInfo(x.desc+' Esta é uma prévia demonstrativa; reservas e informações ao vivo ainda não estão disponíveis.',x.title);content.append(tag,h,p,b);article.append(cover,content);cards.appendChild(article)})}search.addEventListener('input',render);render();
</script></body></html>
